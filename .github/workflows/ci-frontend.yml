name: CI — Frontend

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build frontend docker image
        run: docker compose build frontend

      - name: Install frontend dependencies
        run: docker compose run --rm frontend yarn install:strict

      - name: Install Storybook dependencies for build
        run: docker compose run --rm frontend yarn --cwd ../../packages/storybook install:strict

      - name: Check Vercel Node engine selector
        run: docker compose run --rm frontend yarn check:vercel-engines

      - name: Lint
        run: docker compose run --rm frontend yarn lint

      - name: Format check (frontend)
        run: docker compose run --rm frontend yarn format:check

      - name: Format check (repo root docs and workflows)
        run: docker compose run --rm frontend yarn format:repo:check

      - name: Typecheck
        run: docker compose run --rm frontend yarn typecheck

      - name: Unit tests
        run: docker compose run --rm frontend yarn test:unit

      - name: Strict production build
        run: docker compose run --rm frontend yarn build:strict
