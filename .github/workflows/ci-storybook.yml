name: CI — Storybook

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build frontend docker image
        run: docker compose build frontend

      - name: Lint
        run: docker compose run --rm frontend sh -lc "yarn --cwd ../../packages/storybook install:strict && yarn --cwd ../../packages/storybook lint"

      - name: Format check
        run: docker compose run --rm frontend yarn --cwd ../../packages/storybook format:check

      - name: Typecheck
        run: docker compose run --rm frontend yarn --cwd ../../packages/storybook typecheck

      - name: Storybook UI tests
        run: docker compose run --rm frontend yarn --cwd ../../packages/storybook test:storybook

      - name: Strict Storybook build
        run: docker compose run --rm frontend yarn --cwd ../../packages/storybook build-storybook:strict
